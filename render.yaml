services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: documind-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: documind-redis
          type: redis
          property: connectionString
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: FAISS_INDEX_DIR
        value: /app/faiss_indexes
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: '["https://documind-frontend.onrender.com","http://localhost:8080"]'
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: documind-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          name: documind-backend
          type: web
          property: host

# ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: documind-db
    plan: free
    databaseName: qaapp
    user: postgres

# ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: documind-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
