services:
  # ── Backend API ───────────────────────────────────────────────────────────
  - type: web
    name: documind-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: documind-redis
          type: redis
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: FAISS_INDEX_DIR
        value: /tmp/faiss_indexes
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: '["https://documind-frontend.onrender.com","http://localhost:8080"]'

  # ── Frontend ──────────────────────────────────────────────────────────────
  - type: web
    name: documind-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    dockerBuildArgs:
      - key: VITE_API_URL
        value: https://documind-backend.onrender.com

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: documind-redis
    plan: free
    ipAllowList: []

# ── PostgreSQL ────────────────────────────────────────────────────────────
databases:
  - name: documind-db
    plan: free
    databaseName: qaapp
