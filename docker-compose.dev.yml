services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qaapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/qaapp
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      UPLOAD_DIR: /app/uploads
      FAISS_INDEX_DIR: /app/faiss_indexes
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:8080","http://localhost:3000"]'
    volumes:
      - ./backend:/app
      - uploads_dev:/app/uploads
      - faiss_dev:/app/faiss_indexes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_dev_data:
  uploads_dev:
  faiss_dev:

networks:
  app-network:
    driver: bridge
